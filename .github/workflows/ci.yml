name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Ratchet, not a gate: 84 known errors from the stale generated
      # types.ts. Fails only if the count rises. See scripts/typecheck-ratchet.mjs.
      - name: Typecheck
        run: node scripts/typecheck-ratchet.mjs

      - name: Build
        run: bun run build
        env:
          # Build-time only. Publishable keys are public by design; the real
          # values live in repository secrets so the build does not depend on
          # a committed .env.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - run: bun install --frozen-lockfile

      # The Prisma client is generated code and is not committed, so it has to
      # exist before anything typechecks.
      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      # Boots the real module graph with no database reachable, which is the
      # point: DI misconfiguration fails here rather than in production.
      - name: E2E tests
        run: bun run test:e2e
